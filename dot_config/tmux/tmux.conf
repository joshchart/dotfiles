# Set True color
set-option -sa terminal-overrides ",xterm*:Tc"
# Tell tmux that Ghostty supports extended keys like Ctrl+1..9
set-option -s terminal-features "xterm*:clipboard:ccolour:cstyle:focus:title,screen*:title,rxvt*:ignorefkeys,xterm-ghostty:extkeys"

set -s escape-time 0

# Enable extended keys (CSI u encoding) for proper modifier key support
# Allows Shift+Enter, Ctrl+Shift+<key>, etc. to work correctly in apps
# NOTE: "always" forces CSI-u sequences to ALL panes (not just those that request it)
# This is required because pi/claude-code don't send the kitty keyboard protocol
# activation sequence. The tradeoff is that fish/zsh need explicit bindings for
# the CSI-u Shift+Enter sequence (see fish conf.d/tmux_keys.fish)
set -s extended-keys always
set -s extended-keys-format csi-u

# Config

# Window and pane creation with current path preservation
unbind %
unbind '"'
# bind '"' split-window -v -c "#{pane_current_path}"
# bind % split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"           # Backslash for horizontal split
bind Enter split-window -v -c "#{pane_current_path}"        # Enter for vertical split
bind c new-window -c "#{pane_current_path}"                 # New window in current path

# Bind m to maximize the current pane
unbind z
unbind m
bind m resize-pane -Z

# Use vi keys in copy mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
# bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Reload tmux
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Mouse support
set -g mouse on
set -g focus-events on

# Pane resizing with vim-like keys (-r allows repeat without prefix)
# Use - and = for vertical, [ and ] for horizontal resizing
bind -r - resize-pane -D 2
bind -r = resize-pane -U 2
bind -r ] resize-pane -R 2
bind -r [ resize-pane -L 2

# Make hold-to-repeat work reliably for -r tmux keybinds after the prefix
set -g initial-repeat-time 800
set -g repeat-time 1200

# Copy mode with vim-like keybindings
bind v copy-mode  # Enter copy mode with prefix+v

# Pane resize to be equal
bind BSpace select-layout -E

# Status bar color
set -g status-style 'bg=#1d2230 fg=#769ff0'

# Set prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Direct window switching with Ctrl+number (no prefix needed)
bind-key -n C-1 select-window -t 1
bind-key -n C-2 select-window -t 2
bind-key -n C-3 select-window -t 3
bind-key -n C-4 select-window -t 4
bind-key -n C-5 select-window -t 5
bind-key -n C-6 select-window -t 6
bind-key -n C-7 select-window -t 7
bind-key -n C-8 select-window -t 8
bind-key -n C-9 select-window -t 9

# Start window and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Plugin Management
set -g @plugin 'tmux-plugins/tpm'  # Tmux Plugin Manager

# Seamless navigation between vim and tmux panes
set -g @plugin 'christoomey/vim-tmux-navigator'

# Theme Configuration
# Using custom fork of catppuccin theme
# IMPORTANT: Theme must load BEFORE continuum to avoid overwriting status-right
set -g @plugin 'dmmulroy/catppuccin-tmux'
set -g @catppuccin_flavour 'macchiato'  # Dark theme variant

set -g @catppuccin_window_status_enable "yes"
set -g @catppuccin_window_status_icon_enable "yes"

set -g @catppuccin_icon_window_zoom " "
set -g @catppuccin_icon_window_last "null"
set -g @catppuccin_icon_window_current "null"
set -g @catppuccin_icon_window_mark "null"
set -g @catppuccin_icon_window_silent "null"
set -g @catppuccin_icon_window_activity "null"
set -g @catppuccin_icon_window_bell "null"

set -g @catppuccin_window_middle_separator "null"

set -g @catppuccin_window_default_background "#cad3f5"
set -g @catppuccin_window_default_color "#24273a"
set -g @catppuccin_window_default_fill "all"
set -g @catppuccin_window_default_text "#W"

set -g @catppuccin_window_current_background "#363a4f"
set -g @catppuccin_window_current_color "#c6a0f6"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"

set -g @catppuccin_status_modules_right "directory session"
set -g @catppuccin_maximized_text "null"
set -g @catppuccin_status_left_separator "█"
set -g @catppuccin_status_right_separator "█"
set -g @catppuccin_directory_color "#8aadf4"

# Optional: Custom pane border color (commented out - using theme default)
# set -g pane-active-border-style fg="#c6a0f6"

# Plugins
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

# Session persistence - save and restore tmux sessions
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-strategy-vim 'session'      # Restore vim sessions
set -g @resurrect-strategy-nvim 'session'     # Restore neovim sessions
set -g @resurrect-capture-pane-contents 'on'  # Save pane contents

# Automatic session save/restore
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'         # Auto-restore last saved session
set -g @continuum-boot 'on'            # Auto-start tmux on boot -NEW-
set -g @continuum-save-interval '10'   # Save every 10 minutes
# Only let continuum autosave/restore on the default tmux socket; agent/test sockets stay isolated
set -g @continuum-main-socket-regex '.*/default$'

# Set custom plugin directory 
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'

# Auto-install TPM if not present
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

run '~/.config/tmux/plugins/tpm/tpm'

# Swap windows interactive
# prefix + w to select windows to swap via fzf popup
bind s display-popup -y -1 -w 50% -h 60% -E "/Users/joshhart/.config/tmux/scripts/swap-windows"

# Sessionizer
bind C-o display-popup -E "tms"
bind C-j display-popup -E "tms switch"
bind C-w display-popup -E "tms windows"
bind C-k display-popup -w 90% -h 85% -E "~/.config/tmux/scripts/agent-sessionizer"
bind C-n command-prompt -p "Rename active session to: " "run-shell 'tms rename %1'"
set-hook -g after-select-pane 'run-shell -b "~/.config/tmux/scripts/agent-sessionizer --mark-seen-current-no-visit"'
set-hook -g after-select-window 'run-shell -b "~/.config/tmux/scripts/agent-sessionizer --mark-seen-current-no-visit"'
set-hook -g after-split-window 'run-shell -b "~/.config/tmux/scripts/agent-sessionizer --mark-seen-current-no-visit"'
set-hook -g after-new-window 'run-shell -b "~/.config/tmux/scripts/agent-sessionizer --mark-seen-current-no-visit"'
set-hook -g client-attached 'run-shell -b "~/.config/tmux/scripts/agent-sessionizer --mark-seen-current-no-visit"'
set-hook -gp pane-focus-in 'run-shell -b "~/.config/tmux/scripts/agent-sessionizer --mark-seen-no-visit #{hook_pane}"'
set-hook -gp pane-focus-out 'run-shell -b "~/.config/tmux/scripts/agent-sessionizer --mark-seen #{hook_pane}"'
